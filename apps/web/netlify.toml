# Site base directory: apps/web (set in Netlify UI).
# Install from the workspace root so bun.lock is used, then build the web app.
[build]
  command = "cd ../.. && bun install --frozen-lockfile && cd apps/web && bun run build && rm -rf dist/server/assets"
  publish = "dist/client"

[functions]
  directory = "netlify/functions"
